[project]
name = "triboard-ple"
version = "0.1.0"
description = "TriBoard PLE: distributed micro-LLM inference on 3x ESP32-S3 N16R8 boards with ESP-NOW"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "tokenizers>=0.15.0",
    "datasets>=2.14.0",
    "tqdm>=4.65.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
]
